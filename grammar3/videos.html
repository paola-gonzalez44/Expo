<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Videos - Galería YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1929;
    --bg-gradient: linear-gradient(135deg, #0a1929 0%, #1a365d 50%, #2c5282 100%);
    --card-bg: rgba(23, 27, 36, 0.8);
    --border: rgba(99, 179, 237, 0.3);
    --text: #eceff3;
    --text-dim: #8a92a3;
    --accent: #4299e1;
    --accent-light: #63b3ed;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg-gradient);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
  }
  
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  
  header {
    text-align: center;
    margin-bottom: 50px;
  }
  
  h1 {
    font-size: 2.5rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent-light), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  
  .subtitle {
    color: var(--text-dim);
    font-size: 1.1rem;
  }
  
  .videos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 30px;
  }
  
  .video-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  
  .video-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(66, 153, 225, 0.3);
    border-color: var(--accent);
  }
  
  .video-container {
    position: relative;
    padding-bottom: 56.25%; /* 16:9 aspect ratio */
    height: 0;
    overflow: hidden;
    background: #000;
  }
  
  .video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  
  .video-info {
    padding: 18px 20px;
  }
  
  .video-number {
    font-size: 12px;
    color: var(--accent-light);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    font-weight: 600;
  }
  
  .video-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
  }
  
  .play-hint {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  
  .play-icon {
    width: 20px;
    height: 20px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }
  
  @media (max-width: 768px) {
    h1 { font-size: 1.8rem; }
    .videos-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎬 Mi Galería de Videos</h1>
    <p class="subtitle">Haz clic en cualquier video para reproducirlo aquí mismo</p>
  </header>

  <div class="videos-grid">
    
    <!-- Video 1 -->
    <div class="video-card">
      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/VJzqOdKgdq4?rel=0&modestbranding=1" 
          title="Video 1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="video-info">
        <div class="video-number">Video 1</div>
        <div class="video-title">Mi Primer Video</div>
        <div class="play-hint">
          <div class="play-icon">▶</div>
          <span>Clic para reproducir</span>
        </div>
      </div>
    </div>

    <!-- Video 2 -->
    <div class="video-card">

    <!-- Video 3 -->

          title="Video 3"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="video-info">
        <div class="video-number">Video 3</div>
        <div class="video-title">Mi Tercer Video</div>
        <div class="play-hint">
          <div class="play-icon">▶</div>
          <span>Clic para reproducir</span>
        </div>
      </div>
    </div>

    <!-- Video 4 -->
    <div class="video-card">
      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/_pWh761n6qQ?rel=0&modestbranding=1" 
          title="Video 4"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="video-info">
        <div class="video-number">Video 4</div>
        <div class="video-title">Mi Cuarto Video</div>
        <div class="play-hint">
          <div class="play-icon">▶</div>
          <span>Clic para reproducir</span>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
